<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14403C">
<title>생일 축하해</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14403C;--paper:#FBF3EF;--ink:#1F2B2A;--mist:#A9C2BC;--blush:#F3D9D2;--brass:#C8A25E;--muted:#6A5F52;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B2321;--paper:#EDE2DC;--ink:#1B2524;--mist:#9DB7B1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B2321;--paper:#EDE2DC;--ink:#1B2524;--mist:#9DB7B1;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--blush);font-family:'Gowun Batang','Noto Serif KR','Nanum Myeongjo','AppleMyungjo',serif;-webkit-text-size-adjust:100%}
.cover{min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:11vh 24px 6vh;transition:opacity .8s}
.cover.fade{opacity:0}
.hb{margin:0;font:italic 400 clamp(46px,14vw,72px)/1 'Cormorant Garamond',Georgia,'Times New Roman',serif;color:var(--blush)}
.sub{margin:16px 0 0;font-size:19px;line-height:1.6;color:var(--mist)}
#candle{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#candle:focus-visible{outline:2px solid var(--brass);outline-offset:8px;border-radius:12px}
#candle svg{display:block;width:min(236px,64vw);height:auto;overflow:visible}
.cap{margin:0;font-size:14px;letter-spacing:.02em;color:var(--mist);transition:opacity .4s}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 2.4s ease-in-out infinite}
.glow{animation:pulse 2.4s ease-in-out infinite}
.smoke{stroke-dasharray:120;stroke-dashoffset:120;opacity:0}
@keyframes flick{0%,100%{transform:scale(1) rotate(-1.5deg)}50%{transform:scale(.95,1.05) rotate(1.5deg)}}
@keyframes pulse{50%{opacity:.7}}
@keyframes smoke{0%{opacity:.7;stroke-dashoffset:120}100%{opacity:0;stroke-dashoffset:0;transform:translateY(-12px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.out .flame{animation:none;opacity:0;transform:scale(.3);transition:opacity .35s,transform .35s}
.out .glow{animation:none;opacity:0;transition:opacity .9s}
.out .smoke{animation:smoke 1.6s ease-out .2s forwards}
.out .cap{opacity:0}
#letter{max-width:34rem;margin:0 auto;padding:36px 20px 64px}
#letter.in{animation:rise 1.1s ease-out both}
.paper{background:var(--paper);color:var(--ink);border-radius:3px;padding:30px 26px 26px;box-shadow:0 18px 40px -18px rgba(0,0,0,.55)}
.paper h2{margin:0 0 18px;font-size:22px;font-weight:700}
.paper p{margin:0 0 .95em;font-size:16.5px;line-height:1.95;word-break:keep-all;overflow-wrap:break-word}
.paper .sign{margin:1.6em 0 0;text-align:right;font-weight:700}
.ticket{position:relative;margin-top:30px;background:var(--paper);color:var(--ink);border-radius:14px;box-shadow:0 18px 40px -18px rgba(0,0,0,.55)}
.top{position:relative;padding:24px 24px 20px;border-bottom:2px dashed rgba(31,43,42,.28)}
.top::before,.top::after{content:"";position:absolute;bottom:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.top::before{left:-12px}
.top::after{right:-12px}
.top h2{margin:0 0 6px;font-size:20px;font-weight:700}
.top p{margin:0;font-size:15px;line-height:1.7;color:var(--muted);word-break:keep-all}
#gifticon-slot{padding:22px 24px 26px}
#gifticon-slot img{display:block;width:100%;height:auto;border-radius:10px}
.empty{min-height:230px;display:grid;place-content:center;gap:6px;text-align:center;padding:20px;border:1.5px dashed var(--brass);border-radius:10px;color:var(--muted);font-size:15px;line-height:1.6}
.empty small{font-size:13px}
@media (prefers-reduced-motion:reduce){.flame,.glow,#letter.in{animation:none}.cover{transition:none}}
</style>
</head>
<body>

  <div>

  </button>
  <p class="cap">촛불을 끄면 열려요</p>
</section>

<main id="letter" hidden>
  <article class="paper">
    <!-- LETTER-SLOT: 편지 내용을 넣을 때 아래 #letter-slot 전체를 편지 글(h2, p)로 교체 -->
    <div id="letter-slot"><p>누나 생일 축하해!! 내가 누나 엄청 좋아하는거 알지? 아프지 말고 건강하고, 지금도 그렇지만 누나가 하고 싶은 일 마음껏 하면서 지냈으면 좋겠어. 나랑 오래오래 보쟈~ 사랑해🩵🩵</p></div>

<script>
(function(){
  var btn=document.getElementById('candle'),cover=document.getElementById('cover'),letter=document.getElementById('letter');
  btn.addEventListener('click',function(){
    if(cover.classList.contains('out'))return;
    cover.classList.add('out');
    setTimeout(function(){cover.classList.add('fade')},1200);
    setTimeout(function(){cover.hidden=true;letter.hidden=false;window.scrollTo(0,0);letter.classList.add('in')},2000);
  });
})();
